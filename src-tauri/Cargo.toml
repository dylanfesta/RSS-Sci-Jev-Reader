[package]
name = "smart-rss-reader"
version = "0.1.0"
license = "CC0-1.0"
repository = "https://github.com/dylanfesta/RSS-Sci-Jev-Reader"
description = "Scientific RSS reader with OpenRouter Jev decision ranking (Multi-Platform Tauri v2)"
authors = ["SmartRSSReader"]
edition = "2021"

[lib]
name = "smart_rss_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "smart-rss-reader"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["dep:tauri"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
tauri = { version = "2.8.3", features = [], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.8"
tokio = { version = "1.45.1", features = ["full"] }
axum = "0.8.4"
tower-http = { version = "0.6.8", features = ["fs", "cors"] }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
libsqlite3-sys = { version = "0.27.0", features = ["bundled"] }
aes-gcm = "0.10.3"
pbkdf2 = { version = "0.12.2", features = ["simple"] }
hmac = "0.12.1"
sha2 = "0.10.9"
base64 = "0.22.1"
rand = "0.8.5"
hex = "0.4.3"
quick-xml = "0.37.5"
regex = "1.11.1"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.26", features = ["derive"] }
dirs = "6.0.0"
open = "5.3.3"
